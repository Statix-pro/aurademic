tags:
  - name: Events
    description: Event management

paths:
  /events:
    get:
      summary: Get all events
      tags: [Events]
      responses:
        200:
          description: List of events
    post:
      summary: Create a new event
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Event created

  /events/{id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event details
    put:
      summary: Update an event
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Event updated
    delete:
      summary: Delete an event
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event deleted

  /events/{id}/summary:
    get:
      summary: Get event summary
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event summary
