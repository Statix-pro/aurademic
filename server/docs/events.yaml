tags:
  - name: Events
    description: Event management

components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: "Annual Tech Symposium"
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
          default: draft
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PreEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: "Pre-Symposium Workshop"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        inaugural_date:
          type: string
          format: date
        inaugural_time:
          type: string
          example: "10:00:00"
        inaugural_venue:
          type: string
          example: "Auditorium A"
        valedictory_date:
          type: string
          format: date
        valedictory_time:
          type: string
          example: "16:00:00"
        valedictory_venue:
          type: string
          example: "Auditorium A"
        mode:
          type: string
          enum: [Physical, Virtual, Hybrid]
        meeting_link:
          type: string
        level:
          type: string
          enum: [international, national, state, district, intra_college]
        description:
          type: string
        expected_participants:
          type: integer
          example: 100

paths:
  /events:
    get:
      summary: Get all events
      tags: [Events]
      responses:
        200:
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create a new event
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        201:
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    put:
      summary: Update an event
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        200:
          description: Event updated
    delete:
      summary: Delete an event
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event deleted

  /events/{id}/summary:
    get:
      summary: Get event summary
      tags: [Events]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Event summary
