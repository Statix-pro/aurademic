tags:
  - name: Project
    description: Project management

paths:
  /project-options/agencies/search:
    get:
      summary: Search agencies
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
      responses:
        200:
          description: List of agencies

  /project-options/schemes/search:
    get:
      summary: Search schemes
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
      responses:
        200:
          description: List of schemes

  /project-options/agency-types/search:
    get:
      summary: Search agency types
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
      responses:
        200:
          description: List of agency types

  /project-requests:
    post:
      summary: Create a project request
      tags: [Project]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Project request created
    get:
      summary: Get user project requests
      tags: [Project]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of project requests

  /project-requests/{id}:
    get:
      summary: Get a project request by ID
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Project request details

  /projects:
    post:
      summary: Create a project
      tags: [Project]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Project created

  /projects/{id}:
    get:
      summary: Get a project by ID
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Project details
    put:
      summary: Update a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Project updated
    delete:
      summary: Delete a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Project deleted

  /projects/{id}/authors:
    post:
      summary: Add an author to a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Author added
    get:
      summary: Get authors of a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of authors
    delete:
      summary: Remove an author from a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorId:
                  type: integer
      responses:
        200:
          description: Author removed

  /projects/{id}/contributions:
    post:
      summary: Add a financial contribution to a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Contribution added
    get:
      summary: Get financial contributions of a project
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of contributions

  /projects/{id}/contributions/{contributionId}:
    delete:
      summary: Delete a financial contribution
      tags: [Project]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: contributionId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Contribution deleted
