tags:
  - name: Journal
    description: Journal management

components:
  schemas:
    Journal:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          example: "National"
        title:
          type: string
          example: "Advanced Computing Research"
        type:
          type: string
          example: "Research Article"
        journal_options_id:
          type: integer
        quartile:
          type: string
          example: "Q1"
        impact_factor:
          type: number
          format: float
          example: 4.5
        cite_score:
          type: number
          format: float
          example: 7.2
        anna_university_listed:
          type: boolean
          example: true
        anna_university_annexure_no:
          type: string
          example: "12345"
        acknowledgement:
          type: object
        author_affiliation:
          type: object
        driven_by:
          type: string
          enum: [faculty, student]
          default: faculty
        date_of_submission:
          type: string
          format: date
        status:
          type: string
          default: "waiting"
        volume:
          type: string
          example: "12"
        issue:
          type: string
          example: "4"
        issue_type:
          type: string
        pages_from:
          type: integer
          example: 100
        pages_to:
          type: integer
          example: 115
        article_number:
          type: string
          example: "A123"
        abstract:
          type: string
        keywords:
          type: string
        sdgs:
          type: object
        doi:
          type: string
          example: "10.1000/xyz123"
        credit_to:
          type: string
        reference_number:
          type: string
        accepted_date:
          type: string
          format: date
        available_online_date:
          type: string
          format: date
        file_path:
          type: string

    Author:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Dr. Smith"
        email:
          type: string
          format: email
          example: "smith@example.com"
        designation:
          type: string
          example: "Professor"
        department:
          type: string
          example: "Computer Science"
        organization:
          type: string
          example: "University of Tech"
        country:
          type: string
          example: "USA"

    Index:
      type: object
      properties:
        id:
          type: integer
        journal_id:
          type: integer
        index_name:
          type: string
          example: "Scopus"

    StatusUpdate:
      type: object
      properties:
        id:
          type: integer
        journal_id:
          type: integer
        status:
          type: string
          example: "Submitted"
        user_comment:
          type: string
        admin_reply:
          type: string
        created_at:
          type: string
          format: date-time

    JournalRequest:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        journal_name:
          type: string
        publisher:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]

paths:
  /journals/search:
    get:
      summary: Search journals
      tags: [Journal]
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Search query
      responses:
        200:
          description: List of journals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journal'

  /authors/search:
    get:
      summary: Search authors
      tags: [Journal]
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Author name
      responses:
        200:
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

  /journals:
    post:
      summary: Create a new journal
      tags: [Journal]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Journal'
      responses:
        201:
          description: Journal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'

  /journals/{id}:
    get:
      summary: Get a journal by ID
      tags: [Journal]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Journal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
    put:
      summary: Update a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Journal'
      responses:
        200:
          description: Journal updated
    delete:
      summary: Delete a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Journal deleted

  /journals/{id}/authors:
    post:
      summary: Add an author to a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        201:
          description: Author added
    get:
      summary: Get authors of a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

  /journals/{id}/authors/{dbAuthorId}:
    put:
      summary: Update an author of a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: dbAuthorId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        200:
          description: Author updated

  /journals/{id}/indexes:
    post:
      summary: Add an index to a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Index'
      responses:
        201:
          description: Index added
    get:
      summary: Get indexes of a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of indexes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Index'

  /journals/{id}/status-updates:
    post:
      summary: Create a status update for a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                user_comment:
                  type: string
      responses:
        201:
          description: Status update created
    get:
      summary: Get status updates for a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of status updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusUpdate'

  /status-updates/{statusUpdateId}/admin-reply:
    put:
      summary: Admin reply to status update
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: statusUpdateId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_reply:
                  type: string
      responses:
        200:
          description: Reply updated

  /journals/{id}/upload:
    post:
      summary: Upload a file for a journal
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: File uploaded

  /journal-requests:
    post:
      summary: Create a journal request
      tags: [Journal]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalRequest'
      responses:
        201:
          description: Journal request created
    get:
      summary: Get user journal requests
      tags: [Journal]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of journal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalRequest'

  /journal-requests/{id}:
    get:
      summary: Get a journal request by ID
      tags: [Journal]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Journal request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalRequest'
