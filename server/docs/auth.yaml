tags:
  - name: Auth
    description: Authentication management

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User email
        name:
          type: string
          description: User name
        picture:
          type: string
          description: URL to user picture
        is_admin:
          type: boolean
          description: Whether the user is an admin
          default: false
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        last_login:
          type: string
          format: date-time
          description: Last login timestamp
      example:
        id: 1
        email: "user@example.com"
        name: "John Doe"
        picture: "https://example.com/pic.jpg"
        is_admin: false
        created_at: "2023-01-01T00:00:00Z"
        last_login: "2023-01-02T00:00:00Z"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user:
          $ref: '#/components/schemas/User'
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          id: 1
          email: "user@example.com"
          name: "John Doe"
          picture: "https://example.com/pic.jpg"
          is_admin: false

paths:
  /auth/google:
    post:
      summary: Login with Google
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Google OAuth credential token
              example:
                token: "google-oauth-token-123"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Google login failed
        500:
          description: Server error
