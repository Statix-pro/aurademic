<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KSRCT Research Management System" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <link rel="manifest" href="/manifest.json" />

    <title>KSRCT - Research</title>

    <!-- Bootstrap
         Bootstrap 5 ships with the app bundle (see package.json and the
         `bootstrap/dist/...` imports), so nothing is loaded from a CDN here.

         This block previously pulled five Bootstrap JS bundles across four versions
         (4.5.3 twice, 5.1.3, 5.2.3, 5.3.3) plus jQuery and Popper twice. They
         overwrote one another in load order, and the 5.2.3 bundle carried a truncated
         integrity hash, so the browser blocked it and logged an SRI error on every
         page. Nothing under src/ uses jQuery or data-bs-* attributes — component
         behaviour comes from react-bootstrap — so all of it was redundant.

         The Bootstrap 4.5.3 stylesheet is gone for the same reason: it competed with
         the bundled v5 stylesheet, and which one won depended on load order. -->

    <!-- google fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0"
    />

    <!-- script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFOn21hpq9IpO1QHIVwFqkT8dgW8DDOyT4hLsDkJw6t+/T9uSyCgloH1p"
      crossorigin="anonymous"
    ></script>

    <!-- font-lexend-deca -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet"> -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');
    </style>

    <!-- fab fa icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        font-family: 'Lexend Deca', sans-serif;
        font-optical-sizing: auto;
        overflow-x: hidden;
      }

      /* width */
      ::-webkit-scrollbar {
        width: 5px;
      }

      /* Track */
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      /* Handle */
      ::-webkit-scrollbar-thumb {
        background: #888;
      }

      /* Handle on hover */
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
