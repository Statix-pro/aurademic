name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: guesthouse_audit_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root tooling
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint frontend and backend
        run: npm run lint -- --quiet

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check backend syntax
        run: npm run check:server

      - name: Test backend
        run: npm run test:server

      - name: Test Guest House MySQL audit integration
        run: npm run test:mysql-audit --prefix server
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: guesthouse_audit_test_ci

      - name: Build frontend
        run: npm run build
