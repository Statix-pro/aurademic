name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            event-client/package-lock.json
            server/package-lock.json

      - name: Install root tooling
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install event-client dependencies
        run: npm ci --prefix event-client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint frontend and backend
        run: npm run lint -- --quiet

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check backend syntax
        run: npm run check:server

      - name: Test backend
        run: npm run test:server

      - name: Build frontend
        run: npm run build
